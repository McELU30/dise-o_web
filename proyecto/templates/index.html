<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>MultiBlas | Acceso al Sistema</title>
    
    <!-- CDN de Bootstrap 5 (CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Íconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .bg-login-image {
            background-image: linear-gradient(rgba(13, 110, 253, 0.8), rgba(0, 0, 0, 0.8)), url('https://images.unsplash.com/photo-1518770660439-4636190af475?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
        }
        .form-floating > .form-control {
            border-radius: 10px;
        }
        .btn-ingresar {
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-ingresar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
        }
        .toggle-password {
            cursor: pointer;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            color: #6c757d;
        }
    </style>
</head>
<body>

    <div class="container-fluid vh-100">
        <div class="row h-100">
            
            <!-- PANEL IZQUIERDO: Imagen y Branding -->
            <div class="col-md-6 d-none d-md-flex flex-column justify-content-center align-items-center bg-login-image text-white p-5">
                <i class="bi bi-cpu display-1 mb-3 text-info"></i>
                <h1 class="display-4 fw-bolder">MultiBlas</h1>
                <p class="lead fs-4 text-center mt-3">Soluciones tecnológicas y el mejor hardware para llevar tus proyectos al siguiente nivel desde Huaraz.</p>
            </div>

            <!-- PANEL DERECHO: Formulario de Usuario y Contraseña -->
            <div class="col-12 col-md-6 d-flex justify-content-center align-items-center bg-light">
                <div class="w-100 px-4" style="max-width: 450px;">
                    
                    <div class="text-center mb-5">
                        <h2 class="fw-bold text-dark">Bienvenido de vuelta</h2>
                        <p class="text-muted">Por favor, ingresa tus datos para continuar</p>
                    </div>

                    <!-- CONTENEDOR VACÍO DONDE AJAX INYECTARÁ EL MENSAJE DE ERROR -->
                    <div id="mensaje-error"></div>

                    <!-- FORMULARIO CONECTADO A DJANGO -->
                    <form id="formLogin" method="POST" action="{% url 'validar_usuario' %}">
                        
                        {% csrf_token %} <!-- Etiqueta de seguridad obligatoria -->
                        
                        <!-- Campo: Usuario -->
                        <div class="form-floating mb-4">
                            <input type="text" class="form-control shadow-sm" id="usuarioInput" name="usuario" placeholder="Usuario" required>
                            <label for="usuarioInput" class="text-muted"><i class="bi bi-person me-2"></i>Usuario</label>
                        </div>
                        
                        <!-- Campo: Contraseña -->
                        <div class="form-floating mb-4 position-relative">
                            <input type="password" class="form-control shadow-sm" id="contrasenaInput" name="contrasena" placeholder="Contraseña" required>
                            <label for="contrasenaInput" class="text-muted"><i class="bi bi-lock me-2"></i>Contraseña</label>
                            <i class="bi bi-eye-slash toggle-password fs-5" id="iconoOjo"></i>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-5">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="recordarSesion">
                                <label class="form-check-label text-muted small" for="recordarSesion">Recordar mis datos</label>
                            </div>
                            <a href="#" class="text-decoration-none small fw-bold">¿Olvidaste tu contraseña?</a>
                        </div>
                        
                        <!-- Botón de Enviar -->
                        <button type="submit" class="btn btn-primary btn-ingresar w-100 shadow" id="btnSubmit">
                            <span id="textoBtn">Ingresar al Sistema</span>
                            <span class="spinner-border spinner-border-sm d-none ms-2" id="spinnerBtn" role="status"></span>
                        </button>
                        
                    </form>

                </div>
            </div>

        </div>
    </div>

    <!-- CDN de jQuery (OBLIGATORIO PARA AJAX) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    
    <!-- CDN de Bootstrap (JS Bundle) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Script de interactividad y AJAX -->
    <script>
        // 1. Funcionalidad para el ojito de la contraseña
        const iconoOjo = document.getElementById('iconoOjo');
        const contrasenaInput = document.getElementById('contrasenaInput');

        iconoOjo.addEventListener('click', function () {
            if (contrasenaInput.type === 'password') {
                contrasenaInput.type = 'text';
                this.classList.remove('bi-eye-slash');
                this.classList.add('bi-eye');
                this.classList.add('text-primary');
            } else {
                contrasenaInput.type = 'password';
                this.classList.remove('bi-eye');
                this.classList.add('bi-eye-slash');
                this.classList.remove('text-primary');
            }
        });

        function resetLoginState() {
            const btnSubmit = $('#btnSubmit');
            const textoBtn = $('#textoBtn');
            const spinnerBtn = $('#spinnerBtn');

            textoBtn.text('Ingresar al Sistema');
            spinnerBtn.addClass('d-none');
            btnSubmit.removeClass('disabled');
            $('#mensaje-error').empty();
        }

        window.addEventListener('pageshow', function(event) {
            if (event.persisted || (performance && performance.getEntriesByType && performance.getEntriesByType('navigation')[0]?.type === 'back_forward')) {
                window.location.reload();
            }
        });

        // 2. PETICIÓN AJAX
        $(document).ready(function() {
            resetLoginState();
            $('#formLogin').on('submit', function(e) {
                e.preventDefault(); // Detenemos la recarga de la página

                const btnSubmit = $('#btnSubmit');
                const textoBtn = $('#textoBtn');
                const spinnerBtn = $('#spinnerBtn');

                // Cambiar estado del botón a cargando
                textoBtn.text('Validando...');
                spinnerBtn.removeClass('d-none');
                btnSubmit.addClass('disabled');

                // Limpiar mensajes de error previos
                $('#mensaje-error').empty();

                // Enviar datos por AJAX
                $.ajax({
                    type: 'POST',
                    url: $(this).attr('action'), // Toma la URL del atributo action del form
                    data: $(this).serialize(),   // Captura el usuario, contraseña y el csrf_token automáticamente
                    success: function(response) {
                        if (response.success) {
                            // Si Django dice que las credenciales son correctas, redirigimos
                            window.location.href = response.redirect_url;
                        } else {
                            // Si Django dice que hay error, mostramos la alerta roja SIN recargar
                            $('#mensaje-error').html(`
                                <div class="alert alert-danger text-center shadow-sm fw-bold mb-4" role="alert">
                                    <i class="bi bi-exclamation-triangle-fill me-2"></i> ${response.mensaje}
                                </div>
                            `);
                            
                            // Restauramos el botón
                            textoBtn.text('Ingresar al Sistema');
                            spinnerBtn.addClass('d-none');
                            btnSubmit.removeClass('disabled');
                        }
                    },
                    error: function() {
                        alert("Ocurrió un error en el servidor. Inténtalo más tarde.");
                        textoBtn.text('Ingresar al Sistema');
                        spinnerBtn.addClass('d-none');
                        btnSubmit.removeClass('disabled');
                    }
                });
            });
        });
    </script>
</body>
</html>
