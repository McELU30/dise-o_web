<!-- GRÁFICOS Y CHARTS -->
<div class="row g-4 mb-4">
    <!-- Gráfico 1: Rendimiento Operativo -->
    <div class="col-12 col-md-4">
        <div class="chart-card shadow text-center">
            <h6 class="mb-3 fw-bold">Rendimiento Operativo</h6>
            <div style="position: relative; height: 180px; width: 100%; display: flex; justify-content: center; align-items: center;">
                <canvas id="donutChart1"></canvas>
                <h2 style="position: absolute; font-weight: bold; color: #a3e6cd; font-size: 2rem;">50%</h2>
            </div>
        </div>
    </div>

    <!-- Gráfico 2: Margen de Ganancia -->
    <div class="col-12 col-md-4">
        <div class="chart-card shadow text-center">
            <h6 class="mb-3 fw-bold">Margen de Ganancia</h6>
            <div style="position: relative; height: 180px; width: 100%; display: flex; justify-content: center; align-items: center;">
                <canvas id="donutChart2"></canvas>
                <h2 style="position: absolute; font-weight: bold; color: #3b82f6; font-size: 2rem;">15%</h2>
            </div>
        </div>
    </div>

    <!-- Gráfico 3: Estado del Inventario -->
    <div class="col-12 col-md-4">
        <div class="chart-card shadow">
            <h6 class="mb-3 fw-bold text-center">Estado del Inventario</h6>
            <div style="position: relative; height: 180px; width: 100%;">
                <canvas id="barChart"></canvas>
            </div>
        </div>
    </div>
</div>
